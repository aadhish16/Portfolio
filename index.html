    <meta name="twitter:title" content="Aadhish Kumar S | Robotics & Physical AI">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2300f2ff'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='28' font-weight='700' fill='%23010204'%3EAK%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --cyan: #00f2ff;
            --violet: #8b5cf6;
            --bg: #010204;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg);
            color: #94a3b8;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        
        /* Premium Noise Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            z-index: 9999;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .neon-accent {
            display: inline-block;
            background: linear-gradient(90deg, var(--cyan), var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-right: 0.12em;
            margin-right: -0.12em;
        }

        .bento-card {
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            will-change: transform, opacity;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { 
            background: #222; 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        .neon-white-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .race-car {
            width: 82px;
            height: 34px;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.8));
        }
        .race-car__svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
    </style>
</head>
<body class="selection:bg-cyan-500/30">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
